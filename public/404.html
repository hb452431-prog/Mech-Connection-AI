<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MECH CONNECT AI</title>
    <script type="text/javascript">
      // Single Page Application redirect script for GitHub Pages and static servers
      // Prevents 404 on page refresh for client-side routes like /user, /mechanic, etc.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;
      l.replace(newUrl);
    </script>
  </head>
  <body style="background-color: #0B1120; color: #FFFFFF; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 1.1rem; font-weight: bold;">Connecting to MECH CONNECT AI...</p>
    </div>
  </body>
</html>
