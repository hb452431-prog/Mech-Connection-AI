<svg width="64" height="64" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emblemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1E3B" />
      <stop offset="100%" stopColor="#0353A4" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00B4D8" />
      <stop offset="100%" stopColor="#0077B6" />
    </linearGradient>
    <linearGradient id="roadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0A2540" />
      <stop offset="100%" stopColor="#1E3A8A" />
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#EF4444" />
      <stop offset="100%" stopColor="#DC2626" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <ellipse cx="100" cy="96" rx="92" ry="76" fill="#FFFFFF" stroke="url(#emblemBorder)" stroke-width="9" />
  <ellipse cx="100" cy="96" rx="85" ry="69" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />

  <!-- Internal Dividing Lines -->
  <line x1="100" y1="27" x2="100" y2="96" stroke="#0B1E3B" stroke-width="5.5" stroke-linecap="round" />
  <line x1="100" y1="96" x2="18" y2="128" stroke="#0B1E3B" stroke-width="5.5" stroke-linecap="round" />
  <line x1="100" y1="96" x2="182" y2="128" stroke="#0B1E3B" stroke-width="5.5" stroke-linecap="round" />

  <!-- Top-Left Sector: Car & AI -->
  <g transform="translate(22, 32)">
    <rect x="42" y="5" width="22" height="18" rx="4" fill="#0077B6" stroke="#00B4D8" stroke-width="1.5" />
    <text x="53" y="18" fill="#FFFFFF" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle">AI</text>
    <path d="M10 50 C14 43, 24 37, 36 36 L52 36 C64 36, 70 41, 74 48 L76 52 C76 53, 74 54, 72 54 L12 54 C10 54, 9 52, 10 50 Z" fill="#0B1E3B" />
    <path d="M26 38 L34 30 L48 30 L56 38 Z" fill="#00B4D8" fill-opacity="0.85" />
    <line x1="8" y1="56" x2="74" y2="56" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Top-Right Sector: Tools -->
  <g transform="translate(108, 36)">
    <g transform="rotate(35 40 32)">
      <rect x="36" y="8" width="8" height="24" rx="2" fill="#0077B6" />
      <rect x="38" y="32" width="4" height="28" fill="#0B1E3B" />
    </g>
    <g transform="rotate(-38 40 32)">
      <rect x="36" y="14" width="8" height="38" rx="2" fill="#0B1E3B" />
      <path d="M30 14 C30 6, 50 6, 50 14 C48 18, 44 20, 44 22 L36 22 C36 20, 32 18, 30 14 Z" fill="#0B1E3B" />
      <polygon points="36,4 44,4 42,12 38,12" fill="#F8FAFC" />
      <circle cx="40" cy="54" r="6" fill="#0B1E3B" />
    </g>
  </g>

  <!-- Bottom Sector: GPS Road Map -->
  <clipPath id="bottomFaviconClip">
    <path d="M22 130 L100 100 L178 130 C162 165, 134 172, 100 172 C66 172, 38 165, 22 130 Z" />
  </clipPath>
  <g clip-path="url(#bottomFaviconClip)">
    <rect x="15" y="95" width="170" height="85" fill="url(#roadGradient)" />
    <line x1="100" y1="100" x2="30" y2="175" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.45" />
    <line x1="100" y1="100" x2="100" y2="175" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.45" />
    <line x1="100" y1="100" x2="170" y2="175" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.45" />
    <path d="M100 120 Q92 135, 106 148 T94 172" fill="none" stroke="#00B4D8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- GPS Pin -->
  <g transform="translate(100, 114)">
    <path d="M0 13 C-1.5 11, -8 4, -8 -2 C-8 -7, -4.5 -10.5, 0 -10.5 C4.5 -10.5, 8 -7, 8 -2 C8 4, 1.5 11, 0 13 Z" fill="url(#pinGradient)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="0" cy="-2.5" r="3" fill="#FFFFFF" />
  </g>
</svg>
