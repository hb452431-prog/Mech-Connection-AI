<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Hexagon -->
  <polygon points="50,4 88,24 88,76 50,96 12,76 12,24" fill="#0B1120" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Outer Gear Teeth Accents -->
  <circle cx="50" cy="50" r="34" stroke="#1E293B" stroke-width="3" stroke-dasharray="6 8" />

  <!-- Aerodynamic Car Silhouette Contour -->
  <path d="M26 62 C28 54, 34 46, 42 45 L58 45 C66 46, 72 54, 74 62 L76 66 C76 68, 74 70, 72 70 L28 70 C26 70, 24 68, 24 66 Z" fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="2.5" />
  
  <!-- Windshield / Roofline -->
  <path d="M35 45 L42 34 L58 34 L65 45 Z" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2" />
  
  <!-- Wheels / Tech Nodes -->
  <circle cx="34" cy="67" r="6.5" fill="#0F172A" stroke="url(#amberGrad)" stroke-width="2.5" />
  <circle cx="34" cy="67" r="2.5" fill="#F59E0B" />
  <circle cx="66" cy="67" r="6.5" fill="#0F172A" stroke="url(#amberGrad)" stroke-width="2.5" />
  <circle cx="66" cy="67" r="2.5" fill="#F59E0B" />

  <!-- Mechanical Wrench / AI Neural Spark Center -->
  <path d="M48 20 L52 20 L54 28 L46 28 Z" fill="url(#primaryGrad)" />
  <circle cx="50" cy="50" r="6" fill="#0284C7" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" />

  <!-- AI Connection Circuit Nodes -->
  <line x1="50" y1="34" x2="50" y2="44" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="44" y1="50" x2="35" y2="55" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="56" y1="50" x2="65" y2="55" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <circle cx="50" cy="22" r="2.5" fill="#38BDF8" />
</svg>
