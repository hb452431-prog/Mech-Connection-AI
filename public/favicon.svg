<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1E3B" />
      <stop offset="50%" stopColor="#0A2540" />
      <stop offset="100%" stopColor="#0353A4" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00B4D8" />
      <stop offset="100%" stopColor="#4F46E5" />
    </linearGradient>
    <linearGradient id="favPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF4D4D" />
      <stop offset="100%" stopColor="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Badge with Neon Cyan/Indigo Gradient Border -->
  <circle cx="32" cy="32" r="30" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#00B4D8" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Sector Dividing Lines -->
  <!-- 1. Top Vertical Divider -->
  <line x1="32" y1="5" x2="32" y2="32" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" />
  <!-- 2. Bottom-Left Divider -->
  <line x1="32" y1="32" x2="7" y2="44" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" />
  <!-- 3. Bottom-Right Divider -->
  <line x1="32" y1="32" x2="57" y2="44" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" />

  <!-- SECTOR 1: TOP-LEFT (Car + AI Glow) -->
  <g transform="translate(10, 10)">
    <!-- High-tech Car Silhouette -->
    <path
      d="M3 15 C4 11.5, 8 9, 12 9 L15 9 C18 9, 19.5 11, 20.5 13.5 L21 15 C21 16, 20.5 16.5, 19.5 16.5 L4.5 16.5 C3.5 16.5, 3 16, 3 15 Z"
      fill="#FFFFFF"
    />
    <!-- Windshield -->
    <path d="M8 9.5 L11 7 L15 7 L17 9.5 Z" fill="#00B4D8" />
    <!-- AI Indicator Dot & Trace -->
    <circle cx="10" cy="5" r="1.5" fill="#00E5FF" />
    <line x1="10" y1="5" x2="16" y2="5" stroke="#00E5FF" stroke-width="1" />
    <circle cx="16" cy="5" r="1.2" fill="#00E5FF" />
  </g>

  <!-- SECTOR 2: TOP-RIGHT (Crossed Mechanical Tools) -->
  <g transform="translate(35, 10)">
    <!-- Crossed Wrench (Left slant) -->
    <g transform="rotate(-35 11 11)">
      <rect x="9.5" y="4" width="3" height="14" rx="1" fill="#F8FAFC" />
      <circle cx="11" cy="4" r="3.5" fill="#F8FAFC" />
      <circle cx="11" cy="4" r="1.5" fill="#0B1E3B" />
      <circle cx="11" cy="18" r="2" fill="#F8FAFC" />
    </g>
    <!-- Crossed Screwdriver (Right slant) -->
    <g transform="rotate(35 11 11)">
      <rect x="9.5" y="3" width="3" height="6.5" rx="0.75" fill="#00B4D8" />
      <rect x="10.2" y="9.5" width="1.6" height="9" fill="#F8FAFC" />
    </g>
  </g>

  <!-- SECTOR 3: BOTTOM (GPS Road Map & Pin) -->
  <g>
    <!-- Curved Map Grid Perspective Lines -->
    <line x1="32" y1="33" x2="14" y2="58" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="32" y1="33" x2="32" y2="60" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="32" y1="33" x2="50" y2="58" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="16" y1="46" x2="48" y2="46" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <line x1="12" y1="53" x2="52" y2="53" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />

    <!-- Road Route Line -->
    <path d="M32 38 Q29 45, 33 50 T31 58" fill="none" stroke="#00B4D8" stroke-width="2.2" stroke-linecap="round" />
    <path d="M32 38 Q29 45, 33 50 T31 58" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" />

    <!-- Red GPS Location Marker Pin -->
    <g transform="translate(32, 41)">
      <!-- Drop Shadow -->
      <ellipse cx="0" cy="5.5" rx="2.5" ry="1" fill="#000000" fill-opacity="0.5" />
      <!-- Teardrop Pin -->
      <path d="M0 5 C-0.8 4, -3.2 1.5, -3.2 -0.8 C-3.2 -2.5, -1.8 -4, 0 -4 C1.8 -4, 3.2 -2.5, 3.2 -0.8 C3.2 1.5, 0.8 4, 0 5 Z" fill="url(#favPin)" stroke="#FFFFFF" stroke-width="0.75" />
      <circle cx="0" cy="-0.8" r="1.1" fill="#FFFFFF" />
    </g>
  </g>
</svg>
